name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
#   schedule:
    # Run tests daily at 2 AM UTC
    # - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Initialize Browser library
      run: |
        rfbrowser init
    
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest
    
    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@v2
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run Robot Framework tests
      run: |
        export DISPLAY=:99
        xvfb-run -a robot --outputdir results --variable HEADLESS:True tests/
      env:
        BROWSER: chrome
        HEADLESS: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: |
          results/
          !results/*.png
    
    - name: Upload screenshots
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: screenshots-python-${{ matrix.python-version }}
        path: results/*.png
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: results/output.xml
        check_name: "Robot Framework Test Results (Python ${{ matrix.python-version }})"

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install robotframework-robocop robotframework-tidy
    
    - name: Run Robocop linting
      run: robocop tests/
    
    - name: Check Robot Framework formatting
      run: robotidy --check tests/

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Run safety check
      run: safety check -r requirements.txt
    
    - name: Run bandit security check
      run: bandit -r tests/resources/ -f json -o results/bandit-report.json || true
    
    - name: Upload security results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-results
        path: results/bandit-report.json

  security-with-zap:
    runs-on: ubuntu-latest
    services:
      zap:
        image: owasp/zap2docker-stable
        ports:
          - 8080:8080
        options: >-
          --user zap
          --entrypoint zap-x.sh
        env:
          ZAP_PORT: 8080
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb wget
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Initialize Browser library
      run: |
        rfbrowser init
    
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest
    
    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@v2
    
    - name: Wait for ZAP to start
      run: |
        echo "Waiting for ZAP to start..."
        timeout 60 bash -c 'until curl -f http://localhost:8080; do sleep 2; done'
        echo "ZAP is ready!"
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run security tests with ZAP
      run: |
        export DISPLAY=:99
        xvfb-run -a robot \
          --outputdir results \
          --variable HEADLESS:True \
          --variable ZAP_PROXY:http://localhost:8080 \
          --include security \
          tests/
      env:
        BROWSER: chrome
        HEADLESS: true
        ZAP_PROXY: http://localhost:8080
        ENABLE_SECURITY_TESTS: true
    
    - name: Generate ZAP HTML Report
      run: |
        curl -X GET "http://localhost:8080/OTHER/core/other/htmlreport/" \
          -H "Accept: text/html" \
          -o results/zap-security-report.html
    
    - name: Generate ZAP XML Report
      run: |
        curl -X GET "http://localhost:8080/OTHER/core/other/xmlreport/" \
          -H "Accept: application/xml" \
          -o results/zap-security-report.xml
    
    - name: Upload ZAP security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: zap-security-reports
        path: |
          results/zap-security-report.html
          results/zap-security-report.xml
    
    - name: Upload test results with security
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: |
          results/
          !results/*.png
    
    - name: Check for high-risk vulnerabilities
      run: |
        # Parse ZAP XML report for high-risk vulnerabilities
        if [ -f results/zap-security-report.xml ]; then
          HIGH_RISK_COUNT=$(grep -o '<riskdesc>High</riskdesc>' results/zap-security-report.xml | wc -l)
          echo "High-risk vulnerabilities found: $HIGH_RISK_COUNT"
          if [ "$HIGH_RISK_COUNT" -gt 0 ]; then
            echo "❌ High-risk security vulnerabilities detected!"
            echo "Please review the ZAP security report for details."
            exit 1
          else
            echo "✅ No high-risk vulnerabilities found."
          fi
        else
          echo "⚠️  ZAP report not found, skipping vulnerability check."
        fi
