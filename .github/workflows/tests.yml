name: Robot Framework Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run at 2 AM UTC — catches dependency drift and upstream failures
    - cron: "0 2 * * *"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Gate: linting and formatting must pass before any tests run
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: pip install robotframework-robocop robotframework-tidy

      - name: Robocop static analysis
        run: robocop tests/

      - name: Robotidy format check
        run: robotidy --check tests/

  # ────────────────────────────────────────────────────────────────────────────
  # Gate: dependency vulnerability audit
  # ────────────────────────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  # ────────────────────────────────────────────────────────────────────────────
  # Main test matrix — Python 3.10 through 3.12
  # Tests run against real public endpoints so no services are needed.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      # Browser Library's Playwright runtime is installed by rfbrowser init below.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          rfbrowser init

      - name: Create results directory
        run: mkdir -p results/screenshots

      - name: Run all tests with pabot and rerun failed tests
        run: ./scripts/run_robot_tests.sh tests/
        env:
          HEADLESS: "True"
          USE_PABOT: "true"
          USE_XVFB: "true"
          PABOT_PROCESSES: "4"
          RUN_MOBILE_TESTS: "false"
          DB_TYPE: sqlite
          DB_NAME: results/test.db

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            results/report.html
            results/log.html
            results/dashboard.html
            results/robot_results.db
            results/output.xml
            results/xunit.xml
            results/rerun/output.xml
            results/pabot_results/**

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-py${{ matrix.python-version }}
          path: |
            results/screenshots/*.png
            results/rerun/screenshots/*.png

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: results/output.xml
          check_name: "RF Results (Python ${{ matrix.python-version }})"

  # ────────────────────────────────────────────────────────────────────────────
  # OWASP ZAP passive security scan
  #
  # ZAP runs as a transparent proxy. The regular API and GUI test suites are
  # replayed through it so ZAP can passively observe all HTTP traffic and flag
  # security findings — without any dedicated security test files to maintain.
  #
  # Runs only on main branch pushes and the nightly schedule to avoid burning
  # CI minutes on every PR.
  # ────────────────────────────────────────────────────────────────────────────
  security-zap:
    name: ZAP Passive Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'

    services:
      zap:
        # ghcr.io/zaproxy/zaproxy:stable is the maintained successor to the
        # deprecated owasp/zap2docker-stable image.
        image: ghcr.io/zaproxy/zaproxy:stable
        ports:
          - 8080:8080
        options: >-
          --user zap
          --entrypoint zap-x.sh
        env:
          ZAP_PORT: 8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          rfbrowser init

      - name: Wait for ZAP to be ready
        run: |
          echo "Waiting for ZAP proxy…"
          timeout 90 bash -c 'until curl -sf http://localhost:8080; do sleep 3; done'
          echo "ZAP ready."

      - name: Create results directory
        run: mkdir -p results/screenshots

      - name: Run API and GUI tests through ZAP proxy (passive scan)
        # ZAP_PROXY is picked up by common.robot; all browser and HTTP sessions
        # are automatically routed through ZAP for passive observation.
        run: ./scripts/run_robot_tests.sh tests/api/ tests/gui/
        env:
          HEADLESS: "True"
          USE_PABOT: "true"
          USE_XVFB: "true"
          PABOT_PROCESSES: "4"
          RUN_MOBILE_TESTS: "false"
          ZAP_PROXY: http://localhost:8080

      - name: Generate ZAP HTML report
        if: always()
        run: |
          curl -sf "http://localhost:8080/OTHER/core/other/htmlreport/" \
            -o results/zap-report.html || echo "ZAP report generation failed"

      - name: Generate ZAP XML report
        if: always()
        run: |
          curl -sf "http://localhost:8080/OTHER/core/other/xmlreport/" \
            -o results/zap-report.xml || echo "ZAP XML report generation failed"

      - name: Fail on HIGH-risk findings
        run: |
          if [ -f results/zap-report.xml ]; then
            HIGH=$(grep -c '<riskdesc>High</riskdesc>' results/zap-report.xml || true)
            echo "HIGH-risk findings: ${HIGH}"
            [ "${HIGH}" -eq 0 ] || { echo "HIGH-risk vulnerabilities detected."; exit 1; }
          fi

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-passive-scan-reports
          path: |
            results/zap-report.html
            results/zap-report.xml
            results/report.html
            results/log.html
            results/dashboard.html
            results/robot_results.db
            results/output.xml
            results/rerun/output.xml
            results/screenshots/*.png
            results/rerun/screenshots/*.png
