# Robot Framework default variable overrides.
# These are applied at test-run time by the Makefile / CI.
# Override any value on the command line: robot --variable BROWSER:firefox ...

variable:
  - BASE_URL:https://the-internet.herokuapp.com
  - API_BASE_URL:https://jsonplaceholder.typicode.com
  - BROWSER:chrome
  - HEADLESS:False
  - TIMEOUT:15s
  - RUN_MOBILE_TESTS:false
  - MOBILE_PLATFORM:android
  - MOBILE_APPIUM_SERVER:http://127.0.0.1:4723
  - MOBILE_STARTUP_LOCATOR:
  - MOBILE_TIMEOUT:20s
  - DB_TYPE:sqlite
  - DB_NAME:results/test.db

outputdir: results
loglevel: INFO

pythonpath:
  - .
  - tests/resources
